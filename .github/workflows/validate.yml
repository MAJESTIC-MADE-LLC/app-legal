name: Validate legal pages

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  legal-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s tests -v
      - run: ./scripts/validate_legal_pages.py
