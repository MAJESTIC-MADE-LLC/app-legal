name: Validate legal pages

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  active-products:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Require substantive active-product pages
        run: |
          test -z "$(grep -RIlE 'Draft placeholder|Replace this paragraph|reserved for the' apiary reach-me ride-binder routine-cue || true)"
          for product in apiary reach-me ride-binder routine-cue; do
            test -s "$product/privacy/index.html"
            test -s "$product/terms/index.html"
            test -s "$product/support/index.html"
          done
